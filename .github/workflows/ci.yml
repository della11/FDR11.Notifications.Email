name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore FDR11.Notifications.Email.slnx
          --source https://api.nuget.org/v3/index.json

      - name: Build
        run: >
          dotnet build FDR11.Notifications.Email.slnx
          --configuration Release
          --no-restore
          -p:Version=0.0.0-ci.${{ github.run_number }}
          -p:CI=true

      - name: Test
        run: >
          dotnet test FDR11.Notifications.Email.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Verify package creation
        run: >
          dotnet pack Code/FDR11.Notifications.Email.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=0.0.0-ci.${{ github.run_number }}
          -p:CI=true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FDR11.Notifications.Email-ci-${{ github.run_number }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
